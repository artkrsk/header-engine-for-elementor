<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Artem Semkin Header Engine for Elementor">
  <title>Artem Semkin Header Engine for Elementor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="26" y="42" width="204" height="172" rx="10"/></clipPath>
    <style>
      /* One 9s loop, three holds: the page scrolls, the header keeps the top
         edge and compacts, then everything returns. Holds are keyframe PAIRS
         with identical values; the transition happens between a pair's end and
         the next pair's start, so the ease sits on the keyframe that CLOSES
         each hold.

         Nothing in this stylesheet may contain a literal angle bracket or
         ampersand: served as an image the file is parsed as XML, where style
         contents are NOT raw text, so a bare bracket opens a phantom element
         and the whole SVG fails to parse - silently, as a broken image.

         The bar is a plain rect whose HEIGHT animates, and every child rides
         its own y/width/height/rx - no path interpolation, no transforms on
         the bar itself, so it can never end up mid-morph. The window radius is
         10 on purpose: it clips the bar's top corners, and anything softer
         makes the accent read as a capsule instead of a full-width band.

         The markup attributes double as the resting state - un-stuck, bar at
         full height, page at scroll zero. The PNG fallbacks render from it,
         and reduced motion simply stops the animations and lands there. */
      .track, .bar, .logo, .nav, .shadow {
        animation-duration: 9s;
        animation-iteration-count: infinite;
        animation-fill-mode: both;
      }
      .track { animation-name: track; will-change: transform; }
      .bar { animation-name: bar; }
      .logo { animation-name: logo; }
      .nav { animation-name: nav; }
      .shadow { animation-name: shadow; }
      @keyframes track {
        0%, 16%   { transform: translateY(0);      animation-timing-function: cubic-bezier(.16,1,.3,1); }
        32%, 68%  { transform: translateY(-176px); animation-timing-function: cubic-bezier(.7,0,.15,1); }
        84%, 100% { transform: translateY(0); }
      }
      @keyframes bar {
        0%, 18%   { height: 44px; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        30%, 68%  { height: 30px; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        84%, 100% { height: 44px; }
      }
      @keyframes logo {
        0%, 18%   { y: 55px; width: 18px; height: 18px; rx: 6px; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        30%, 68%  { y: 50px; width: 14px; height: 14px; rx: 5px; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        84%, 100% { y: 55px; width: 18px; height: 18px; rx: 6px; }
      }
      @keyframes nav {
        0%, 18%   { y: 60px; height: 8px; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        30%, 68%  { y: 53px; height: 7px; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        84%, 100% { y: 60px; height: 8px; }
      }
      @keyframes shadow {
        0%, 18%   { y: 86px; opacity: 0; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        30%, 68%  { y: 72px; opacity: 1; animation-timing-function: cubic-bezier(.34,1.25,.64,1); }
        84%, 100% { y: 86px; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .track, .bar, .logo, .nav, .shadow { animation: none; }
      }
    </style>
  </defs>

  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="53.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <g clip-path="url(#win)">
    <rect x="26" y="42" width="204" height="172" fill="#FFFFFF" fill-opacity="0.03"/>

    <g class="track" fill="#FFFFFF">
      <rect x="42" y="104" width="172" height="72" rx="14" fill-opacity="0.13"/>
      <rect x="42" y="188" width="120" height="9" rx="4.5" fill-opacity="0.20"/>
      <rect x="42" y="206" width="92" height="9" rx="4.5" fill-opacity="0.13"/>
      <rect x="42" y="232" width="82" height="64" rx="12" fill-opacity="0.10"/>
      <rect x="132" y="232" width="82" height="64" rx="12" fill-opacity="0.10"/>
      <rect x="42" y="310" width="140" height="9" rx="4.5" fill-opacity="0.16"/>
      <rect x="42" y="328" width="104" height="9" rx="4.5" fill-opacity="0.10"/>
      <rect x="42" y="354" width="172" height="60" rx="12" fill-opacity="0.10"/>
    </g>

    <rect class="shadow" x="26" y="86" width="204" height="12" fill="url(#shadow)" opacity="0"/>
    <rect class="bar" x="26" y="42" width="204" height="44" fill="#4F46E5"/>
    <rect class="logo" x="42" y="55" width="18" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>
    <g fill="#FFFFFF" fill-opacity="0.55">
      <rect class="nav" x="140" y="60" width="26" height="8" rx="4"/>
      <rect class="nav" x="174" y="60" width="20" height="8" rx="4"/>
      <rect class="nav" x="202" y="60" width="12" height="8" rx="4"/>
    </g>
  </g>

  <rect x="26" y="42" width="204" height="172" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
</svg>
