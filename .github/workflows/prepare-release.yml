name: Prepare Release

# Opens a "Release x.y.z" PR: Claude drafts the readme.txt changelog entry, arts-wp stamps
# the release commit. Merging that PR is the release: cut-release.yml then tags it and the
# tag starts release.yml (GitHub Release + wp.org SVN).
#
# Runs every weekday morning, and on demand. It does nothing (no Claude call, no PR) unless
# src/ changed since the last tag and no release PR is already open. Scheduled runs are real;
# a manual run has dry_run ticked by default, which prints the entry and diff to the job
# summary and opens nothing.

on:
  schedule:
    # Weekdays 06:17 UTC. Off the hour on purpose: GitHub delays runs scheduled at :00.
    - cron: '17 6 * * 1-5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force x.y.z (empty = Claude decides; replaces an open release PR)'
        required: false
        type: string
      dry_run:
        description: 'Print the entry and diff to the job summary; push and open nothing'
        required: false
        type: boolean
        default: true

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  prepare:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/prepare-release.yml@main
    with:
      client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
