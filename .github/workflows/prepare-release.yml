name: Prepare Release

# Opens a "Release x.y.z" PR: Claude drafts the readme.txt changelog entry, arts-wp stamps
# the release commit. Merging deploys nothing; pushing the vX.Y.Z tag does (release.yml).
# Dispatch-only while piloting. dry_run is on by default: it prints the entry and diff to
# the job summary and opens nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Force x.y.z (empty = Claude decides; replaces an open release PR)'
        required: false
        type: string
      dry_run:
        description: 'Print the entry and diff to the job summary; push and open nothing'
        required: false
        type: boolean
        default: true

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  prepare:
    # Pilot pin: the feature branch of the shared repo. Switch to @main once it is merged.
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/prepare-release.yml@48896f1caa1cba0a681c1b88b67637d423d5a85c
    with:
      client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
