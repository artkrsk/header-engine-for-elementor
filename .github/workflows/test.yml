name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref: only the newest push's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      # 103 KB actual (60 KB plus the prefixed arts/base) — 0.12 MB leaves ~19 KB headroom
      zip_budget_mb: '0.12'
      blueprint_check: true
      # coverage: true after the repo goes public (Codecov)
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
